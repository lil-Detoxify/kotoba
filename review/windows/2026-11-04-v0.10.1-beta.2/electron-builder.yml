extends: null
appId: app.kotobud.desktop
productName: KotoBud
copyright: Copyright © 2026 KotoBud
asar: true
npmRebuild: false
electronVersion: 44.3.0
electronDist: node_modules/.ignored_electron/dist
directories:
  app: apps/windows
  output: review/windows/2026-11-04-v0.10.1-beta.2/pack
files:
  - main.cjs
  - protocol.cjs
  - preload.cjs
  - package.json
  - icon.png
  - icon.ico
extraResources:
  - from: review/windows/2026-11-04-v0.10.1-beta.2/stage
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: apps/windows/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KotoBud
  deleteAppDataOnUninstall: false
  installerIcon: apps/windows/icon.ico
  uninstallerIcon: apps/windows/icon.ico
  installerHeaderIcon: apps/windows/icon.ico
  artifactName: KotoBud-${version}-Windows-x64-Setup.${ext}
portable:
  artifactName: KotoBud-${version}-Windows-x64-Portable.${ext}
  unpackDirName: KotoBud
