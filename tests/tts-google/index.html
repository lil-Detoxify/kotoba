<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kotoba · Google TTS 试听</title>
<style>
body{font:16px system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#202124;background:#fafafa}h1{font-size:1.5rem}.word{background:#fff;border:1px solid #ddd;border-radius:10px;padding:1rem;margin:1rem 0}.term{font-size:1.4rem;font-weight:700}.reading{color:#555;margin:.25rem 0}.meaning{margin:.5rem 0 1rem}.voices{display:flex;gap:.5rem;flex-wrap:wrap}button{padding:.45rem .75rem;border:1px solid #bbb;border-radius:6px;background:#f5f5f5;cursor:pointer}button:hover{background:#e8f0fe}.nav{position:sticky;bottom:1rem;background:#fff;border:1px solid #ddd;border-radius:8px;padding:.7rem;display:flex;gap:.6rem;align-items:center}
</style>
<h1>Kotoba Google TTS · 10 词试听</h1>
<p>每个词均使用教材 reading；四个按钮分别播放对应 WaveNet 音频。</p>
<main id="list"></main>
<div class="nav"><button id="prev">上一词</button><span id="position"></span><button id="next">下一词</button></div>
<script>
const words=[
['001','今日','きょう','今天'],['002','喫茶店','きっさてん','咖啡馆'],['003','旅行','りょこう','旅行'],['004','コンピュータ','コンピュータ','计算机，电脑'],['005','大丈夫','だいじょうぶ','没关系，放心'],['006','一生懸命','いっしょうけんめい','拼命地，努力地'],['007','発表','はっぴょう','发表，发布，宣布，揭晓'],['008','環境','かんきょう','环境'],['009','今日','こんにち','现在，今天'],['010','思いっきり','おもいっきり','痛快地，尽情地']
];
const voices=['A','B','C','D']; const list=document.querySelector('#list'); const audio=new Audio();
words.forEach((w,i)=>{const el=document.createElement('section');el.className='word';el.id='word-'+w[0];el.innerHTML=`<div class="term">${w[1]}</div><div class="reading">${w[2]}</div><div class="meaning">${w[3]}</div><div class="voices">${voices.map(v=>`<button data-file="output/wavenet-${v.toLowerCase()}/${w[0]}_ja-JP-Wavenet-${v}.mp3">WaveNet ${v} ▶</button>`).join('')}</div><small class="status" aria-live="polite"></small>`;el.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const status=el.querySelector('.status');audio.pause();audio.src=b.dataset.file;status.textContent='正在播放…';try{await audio.play()}catch(e){status.textContent='尚未生成（请先运行 generate.mjs）'}});list.append(el)});
let current=0;function show(){document.querySelector('#word-'+words[current][0]).scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#position').textContent=`${current+1} / ${words.length}`};document.querySelector('#prev').onclick=()=>{current=(current+words.length-1)%words.length;show()};document.querySelector('#next').onclick=()=>{current=(current+1)%words.length;show()};show();
</script>
